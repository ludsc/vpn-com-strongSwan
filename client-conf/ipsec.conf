config setup
    charondebug="ike 1, knl 1, cfg 0"

conn ikev2-vpn
    auto=start
    type=tunnel
    keyexchange=ikev2
    left=%any
    leftid="CN=vpn-client"
    leftcert=client-cert.pem
    leftsourceip=%config
    right=10.10.10.10
    rightid="CN=10.10.10.10"
    rightsubnet=0.0.0.0/0
    rightauth=pubkey
